*{box-sizing:border-box}body{margin:0}
/* Layout: one full-screen scene on canvas, sticky-note HUD, paper-card overlays */
:root{
  --ink:#1F2A30; --note:#FFD84D; --note2:#A8E6CF; --paper:#FBFBF8; --soft:#EEF3F1; --line:#D9E1DD;

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%;cursor:crosshair}
.hud{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.chip{background:var(--note);color:var(--ink);padding:6px 11px;font-family:var(--display);font-size:15px;line-height:1.2;box-shadow:0 2px 0 rgba(0,0,0,.13);font-variant-numeric:tabular-nums}
.chip:nth-child(1){transform:rotate(-1.5deg)}
.chip:nth-child(2){background:var(--note2);transform:rotate(1deg)}
.chip:nth-child(3){background:#FFFFFF;transform:rotate(-.5deg)}
.chip:nth-child(4){background:#CFE0FF;transform:rotate(1deg)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.hbtn{pointer-events:auto;border:0;background:var(--paper);font-family:var(--display);font-size:14px;padding:6px 10px;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.13);cursor:pointer}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:var(--shade);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));touch-action:auto}
.card{background:var(--paper);color:var(--ink);width:100%;max-width:400px;padding:26px 20px 20px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:12px;position:relative;max-height:calc(100% - 20px);overflow:auto;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.card::before{content:"";position:absolute;top:-1px;left:50%;width:90px;height:20px;margin-left:-45px;background:rgba(255,216,77,.9);transform:rotate(2deg)}
@keyframes pop{from{transform:scale(.92) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.card h1,.card h2,.card h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.card h1{font-size:40px;letter-spacing:-.5px;line-height:1.1}
.card h2{font-size:28px}
.card h3{font-size:17px;text-align:left}
.card p{margin:0;font-size:15px;line-height:1.55}
.small{font-size:13px;opacity:.72}
.stars{font-size:34px;letter-spacing:6px;color:#E0A800}
.stars .off{color:#D5D9D6}
.how{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;font-size:14px;background:var(--soft);padding:12px}
.how b{font-family:var(--display);font-weight:400}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button.main{font-family:var(--display);font-size:20px;background:var(--ink);color:var(--note);border:0;padding:12px 26px;border-radius:999px;cursor:pointer}
button.sub{font-family:var(--display);font-size:16px;background:transparent;color:var(--ink);border:2px solid var(--ink);padding:9px 18px;border-radius:999px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #2D6CDF;outline-offset:2px}
.nickrow{display:flex;gap:6px;align-items:center;background:var(--soft);padding:10px 12px}
.nickrow label{font-family:var(--display);font-size:15px;white-space:nowrap}
.nickrow input{flex:1;min-width:0;font:16px var(--body);padding:8px 10px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:6px}
.tag{font-family:var(--display);font-size:15px;opacity:.6;white-space:nowrap;font-variant-numeric:tabular-nums}
.loc{display:flex;flex-direction:column;gap:6px}
.loc h3{display:flex;align-items:center;gap:8px}

.st{font-family:var(--display);border:2px solid var(--line);background:#fff;color:var(--ink);padding:7px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:6px;min-width:0}
.st b{font-weight:400;font-size:18px}
.st span{font-size:11px;color:#E0A800;letter-spacing:1px}

.tabs button.on{background:var(--ink);color:var(--note)}
.stagepick{display:flex;align-items:center;justify-content:space-between;gap:8px}

.stagepick div{font-family:var(--display);font-size:17px}
.rank{list-style:none;margin:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.rank li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 8px;background:#fff;border-bottom:1px solid var(--line)}
.rank li .no{font-family:var(--display);font-size:17px;text-align:center}
.rank li:nth-child(1) .no{color:#C99500}.rank li:nth-child(2) .no{color:#7D8F99}.rank li:nth-child(3) .no{color:#B0703A}
.rank li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rank li .nm small{opacity:.55;margin-left:3px}
.rank li .sc{font-family:var(--display);font-size:16px}
.rank li.me{background:#FFF6CC}
.empty{padding:18px;background:var(--soft);font-size:14px}
.note{font-size:12.5px;background:var(--soft);padding:8px 10px;text-align:left;line-height:1.5}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:var(--soft);padding:10px 14px;font-variant-numeric:tabular-nums;font-size:14px}

@media (prefers-reduced-motion:reduce){.card{animation:none}}

/* ================= 기본 ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let W=0,H=0,S=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;S=Math.min(W,H);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

let lv=0,goals=0,thrown=0,streak=0,goalPts=0,windBase=0,wind=0,state='menu',paused=false,time=0,waitT=0;
let ball=null,drag=null,lastAim=null,parts=[],texts=[],streaks=[],walkers=[],birds=[],walkT=0,muted=false,banner=null,shake=0,binWob=0;

/* ================= 저장 (내 브라우저) ================= */
function loadLocal(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const prog=loadLocal('tt3_prog',{best:{},stars:{}});
let nick=loadLocal('tt3_nick','');
let localId=loadLocal('tt3_lid','');if(!localId){localId=Math.random().toString(36).slice(2,10);saveLocal('tt3_lid',localId)}
function unlockedUpTo(){let i=0;while(i<STAGES.length&&prog.best[i]!=null)i++;return Math.min(i,STAGES.length-1)}
function totalScore(b){return Object.values(b||{}).reduce((a,v)=>a+(+v||0),0)}

/* ================= 온라인 랭킹 (db) ================= */
const NET={db:null,user:null,uid:null,ro:false,docs:[],status:'loading',writing:false,pending:false};
function hashTag(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}h>>>=0;return `${(h&255)||1}.${((h>>8)&255)||1}`}
function myTag(){return hashTag(NET.uid||localId)}
function myNick(){return nick||'ㅇㅇ'}
async function initNet(){
  if(!window.firebase||!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId){NET.status='nocfg';refreshRank();return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const cred=await firebase.auth().signInAnonymously();
    NET.uid=cred.user.uid;NET.db=firebase.firestore();
    const ni=$('nick');if(ni)ni.nextElementSibling.textContent='('+myTag()+')';
    let timer=setTimeout(()=>{if(NET.status==='loading'){NET.status='slow';refreshRank()}},10000);
    NET.db.collection('ranks').orderBy('total','desc').limit(500).onSnapshot(s=>{
      NET.docs=s.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(!s.metadata.fromCache&&timer){clearTimeout(timer);timer=null}
      NET.status='on';mergeMine();refreshRank();
    },e=>{if(timer)clearTimeout(timer);console.warn(e);NET.status='off';refreshRank()});
  }catch(e){console.warn(e);NET.status='off';refreshRank()}
}
function mergeMine(){
  const me=NET.docs.find(d=>d.id===NET.uid);if(!me)return;
  let changed=false;const b=me.best||{};
  for(const k in b){const i=+k.slice(1);if(!(i>=0))continue;if(prog.best[i]==null||b[k]>prog.best[i]){prog.best[i]=b[k];changed=true}}
  if(changed)saveLocal('tt3_prog',prog);
  if(!nick&&me.nick){nick=me.nick;saveLocal('tt3_nick',nick)}
  const ni=$('nick');if(ni&&!ni.value&&nick)ni.value=nick;
}
async function pushOnline(){
  if(!NET.db||!NET.uid||NET.ro)return;
  if(NET.writing){NET.pending=true;return}
  NET.writing=true;
  const best={};for(const k in prog.best)best['s'+k]=prog.best[k];
  try{await NET.db.collection('ranks').doc(NET.uid).set({nick:myNick(),tag:myTag(),best,total:totalScore(prog.best),cleared:Object.keys(prog.best).length,t:Date.now()})}
  catch(e){console.warn(e);if(e&&e.code==='permission-denied')NET.ro=true;refreshRank()}
  NET.writing=false;if(NET.pending){NET.pending=false;pushOnline()}
}
function stageBoard(i){return NET.docs.filter(d=>d.best&&d.best['s'+i]!=null).map(d=>({id:d.id,nick:d.nick||'ㅇㅇ',tag:d.tag||'',sc:d.best['s'+i],t:d.t||0})).sort((a,b)=>b.sc-a.sc||a.t-b.t)}
function totalBoard(){return NET.docs.filter(d=>d.total>0).map(d=>({id:d.id,nick:d.nick||'ㅇㅇ',tag:d.tag||'',sc:d.total,t:d.t||0,cl:d.cleared||0})).sort((a,b)=>b.sc-a.sc||a.t-b.t)}
function myRank(list){const i=list.findIndex(r=>r.id===NET.uid);return i<0?null:i+1}

/* ================= 소리 ================= */
let ac=null;
function au(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();}
function tone(f,d,type,v,f2){if(muted||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);}
function noise(d,f,v){if(muted||!ac)return;const len=ac.sampleRate*d,buf=ac.createBuffer(1,len,ac.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=buf;fl.type='bandpass';fl.frequency.value=f;g.gain.value=v;s.connect(fl).connect(g).connect(ac.destination);s.start();}
const sfx={throw:()=>noise(.25,1400,.25),rim:()=>tone(1500,.12,'triangle',.12,900),wall:()=>tone(260,.1,'square',.06,160),bonk:()=>tone(420,.12,'sine',.12,260),bird:()=>{tone(1800,.07,'sine',.08,2400);setTimeout(()=>tone(2000,.07,'sine',.08,2600),80)},goal:()=>{noise(.12,500,.3);tone(660,.15,'sine',.16);setTimeout(()=>tone(990,.25,'sine',.16),110)},miss:()=>tone(240,.3,'sine',.12,110),clear:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.14),i*110))};

/* ================= 지오메트리 ================= */
function geo(){
  const L=STAGES[lv];
  const floorY=H*.86,r=clamp(S*.028,9,16),g=H*1.9;
  const sx=Math.max(56,W*.13),sy=floorY-Math.min(H*.26,S*.42);
  const bw=r*L.w,bh=r*4.6;
  let bx=W*L.x+(L.move?Math.sin(time*L.move.s)*L.move.a*W:0);
  bx=clamp(bx,sx+bw,W-bw/2-8);
  const rects=[],circles=[];
  for(const o of (L.obs||[])){
    const X=W*o.x;
    if(o.k==='partition'){const w=r*1.5;rects.push({x:X-w/2,y:floorY-o.h*H,w,h:o.h*H,k:'partition'})}
    if(o.k==='lamp'){const w=r*5,h=r*2;rects.push({x:X-w/2,y:o.h*H-h,w,h,k:'lamp',cx:X})}
    if(o.k==='table'||o.k==='desk'){const w=r*(o.k==='desk'?5.5:7),ty=floorY-o.h*H;rects.push({x:X-w/2,y:ty,w,h:r*.6,k:o.k+'top'});rects.push({x:X-r*.3,y:ty,w:r*.6,h:o.h*H,k:'leg',k2:o.k})}
    if(o.k==='tree'){const cy=floorY-o.h*H-r*2.5;rects.push({x:X-r*.7,y:cy,w:r*1.4,h:floorY-cy,k:'trunk'});circles.push({x:X,y:cy,r:r*3.6,k:'canopy'})}
    if(o.k==='sign'){const top=floorY-o.h*H;rects.push({x:X-r*.25,y:top,w:r*.5,h:o.h*H,k:'pole'});rects.push({x:X-r*1.7,y:top,w:r*3.4,h:r*2.4,k:'plate'})}
    if(o.k==='board'){const w=r*7,h=r*2.6;rects.push({x:X-w/2,y:o.h*H-h,w,h,k:'board'})}
    if(o.k==='bench'){const w=r*6;rects.push({x:X-w/2,y:floorY-o.h*H,w,h:o.h*H,k:'bench'})}
  }
  if(L.fan){const f=L.fan,cx=W*f.x,cy=H*f.y,len=r*f.len;circles.push({x:cx,y:cy,r:r*.8,k:'hub'});
    for(let b=0;b<3;b++){const a=time*f.spd+b*Math.PI*2/3;for(const d of[.38,.66,.92])circles.push({x:cx+Math.cos(a)*len*d,y:cy+Math.sin(a)*len*d*.45,r:r*.55,k:'blade'})}}
  return {floorY,r,g,sx,sy,bw,bh,bx,topY:floorY-bh,rects,circles,vmax:1.5*Math.sqrt(g*W*.9),Lmax:S*.38};
}
function binSegs(G){const t=G.topY,f=G.floorY,a=G.bw/2,b=G.bw*.41;return[[G.bx-a,t,G.bx-b,f],[G.bx+a,t,G.bx+b,f]];}

function startStage(i){

function newBall(){
  const L=STAGES[lv],G=geo();

function afterThrow(){

      ${last?`<p><b>모든 스테이지 클리어!</b> 총점 ${totalScore(prog.best)}점</p>`:move?`<p><b>장소 이동!</b> 다음은 ${LOCS[nx.sc].name}</p>`:''}
      <div class="btns"><button class="sub" id="b2" type="button">다시</button><button class="sub" id="b3" type="button">랭킹</button>${last?'':`<button class="main" id="b1" type="button">다음</button>`}</div>`);

/* ================= 입력: 드래그 ================= */
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{if(state!=='aim'||paused)return;au();const p=pt(e);drag={s:p,c:p};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(drag)drag.c=pt(e)});
cv.addEventListener('pointerup',()=>{if(!drag)return;const d=aimVec();const a=drag;drag=null;if(!d||state!=='aim')return;
  lastAim={dx:a.c.x-a.s.x,dy:a.c.y-a.s.y,p:d.p};ball.vx=d.vx;ball.vy=d.vy;thrown++;state='fly';sfx.throw();hud()});
cv.addEventListener('pointercancel',()=>{drag=null});
function aimVec(){
  if(!drag)return null;const G=geo();
  const dx=drag.c.x-drag.s.x,dy=drag.c.y-drag.s.y,len=Math.hypot(dx,dy);
  if(len<14)return null;
  const p=Math.min(1,len/G.Lmax),v=G.vmax*p;
  return{vx:dx/len*v,vy:dy/len*v,p};
}

/* ================= 물리 ================= */
function collideSeg(b,ax,ay,bx,by,th,bounce){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=((b.x-ax)*dx+(b.y-ay)*dy)/l2;t=clamp(t,0,1);
  const px=ax+dx*t,py=ay+dy*t;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny),R=b.r+th;
  if(d<R&&d>1e-4){nx/=d;ny/=d;b.x=px+nx*R;b.y=py+ny*R;const vn=b.vx*nx+b.vy*ny;
    if(vn<0){b.vx-=(1+bounce)*vn*nx;b.vy-=(1+bounce)*vn*ny;b.vx*=.9;b.vy*=.9;return Math.abs(vn)>60}}
  return false;
}
function collideRect(b,R,bounce){
  const cx=clamp(b.x,R.x,R.x+R.w),cy=clamp(b.y,R.y,R.y+R.h);let nx=b.x-cx,ny=b.y-cy,d=Math.hypot(nx,ny);
  if(d>=b.r)return false;
  if(d<1e-4){const l=b.x-R.x,r=R.x+R.w-b.x,t=b.y-R.y,bt=R.y+R.h-b.y,m=Math.min(l,r,t,bt);
    if(m===l){nx=-1;ny=0;b.x=R.x-b.r}else if(m===r){nx=1;ny=0;b.x=R.x+R.w+b.r}else if(m===t){nx=0;ny=-1;b.y=R.y-b.r}else{nx=0;ny=1;b.y=R.y+R.h+b.r}}
  else{nx/=d;ny/=d;b.x=cx+nx*b.r;b.y=cy+ny*b.r}
  const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+bounce)*vn*nx;b.vy-=(1+bounce)*vn*ny;return Math.abs(vn)>60}
  return false;
}
function collideCircle(b,C,bounce){
  let nx=b.x-C.x,ny=b.y-C.y;const d=Math.hypot(nx,ny),R=b.r+C.r;if(d>=R||d<1e-4)return false;
  nx/=d;ny/=d;b.x=C.x+nx*R;b.y=C.y+ny*R;const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+bounce)*vn*nx;b.vy-=(1+bounce)*vn*ny;return Math.abs(vn)>40}return false;
}
function walkerRect(w,G){return{x:w.x-w.w/2,y:G.floorY-w.h,w:w.w,h:w.h}}
function step(h,G){
  const b=ball;
  b.vy+=G.g*h;b.vx+=wind*G.g*h;b.x+=b.vx*h;b.y+=b.vy*h;b.rot+=b.vx*h*.03;
  for(const s of binSegs(G)){if(collideSeg(b,s[0],s[1],s[2],s[3],2,.45)){if(!b.done)b.rim=true;binWob=.5;sfx.rim()}}
  for(const R of G.rects)if(collideRect(b,R,.35)){sfx.wall();b.sq=.15}
  for(const C of G.circles)if(collideCircle(b,C,C.k==='blade'||C.k==='hub'?.6:.25)){sfx.wall();b.sq=.15;if(C.k==='canopy'){b.vx*=.7;b.vy*=.7}}
  if(!b.done)for(const w of walkers){if(w.x<G.sx+G.r*3)continue;
    if(collideRect(b,walkerRect(w,G),.4)){b.vx+=w.vx*.6;if(!w.hit){w.hit=1.2;sfx.bonk();popText(['앗!','어이쿠','죄송해요!','누구야?'][Math.floor(Math.random()*4)],w.x,G.floorY-w.h-G.r*1.5,'#D9480F',1)}}}
  for(const bd of birds){if(collideCircle(b,{x:bd.x,y:bd.y,r:G.r*1.1},.5)){if(!bd.scared){bd.scared=1;bd.vy=-260;bd.vx*=2.2;sfx.bird();popText('구구!',bd.x,bd.y-G.r*2,'#5B6B73',.9)}}}
  if(!b.done&&b.y>G.topY+b.r*.4&&b.y<G.floorY){
    const k=(b.y-G.topY)/G.bh,half=G.bw/2-(G.bw/2-G.bw*.41)*k;
    if(Math.abs(b.x-G.bx)<half-b.r*.3){scoreGoal(G);return}
  }
  if(b.y+b.r>G.floorY){b.y=G.floorY-b.r;if(b.vy>0){b.vy*=-.28;b.sq=.12}b.vx*=.85;
    if(!b.done){b.done=true;streak=0;const near=Math.abs(b.x-G.bx)<G.bw*1.3;popText(near?'아깝다!':'빗나감',b.x,G.floorY-G.r*3,near?'#D9480F':'#5B6B73');sfx.miss();waitT=1}}
  if(!b.done&&(b.x<-80||b.x>W+80||b.y>H+80)){b.done=true;streak=0;popText('장외!',clamp(b.x,40,W-40),H*.5,'#5B6B73');sfx.miss();waitT=.8}
}
const GOAL_MSG=['골인!','나이스!','들어갔다!','오늘 운 좋다'];
function scoreGoal(G){
  goals++;streak++;state='in';ball.relX=ball.x-G.bx;sfx.goal();
  const clean=!ball.rim,pts=100+(clean?50:0)+(streak-1)*30;goalPts+=pts;
  const head=clean?(streak>1?`${streak}연속 깔끔!`:'깔끔하게 골인!'):(streak>1?`${streak}연속 골!`:'림 맞고 골인!');
  popText(head,G.bx,G.topY-G.r*3.4,'#1F7A4D');popText(`+${pts}`,G.bx,G.topY-G.r*1.4,'#E0A800',1.1,.8);
  for(let i=0;i<18;i++)spawnConfetti(G.bx,G.topY);

  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x-h*.12,fy-leg-body,h*.07,body);
  if(o.sc==='cafe'){ctx.fillStyle='#FBFBF8';ctx.fillRect(x-h*.1,fy-leg-body*.6,h*.2,body*.6);ctx.fillStyle='#8E6A4B';ctx.fillRect(x+o.dir*h*.12,fy-leg-body*.7,o.dir*h*.22,4);ctx.fillStyle='#FBFBF8';ctx.fillRect(x+o.dir*h*.22,fy-leg-body*.7-10,8,10)}
  else if(o.kid){ctx.fillStyle='#C8553D';rr(x-o.dir*h*.24,fy-leg-body*.95,h*.14,body*.6,3);ctx.fill()}
  else if(o.bag){ctx.fillStyle='#3A3F45';ctx.fillRect(x-o.dir*h*.2,fy-leg-body*.4,h*.14,h*.16)}
  ctx.fillStyle='#F2C9A0';ctx.beginPath();ctx.arc(x,fy-leg-body-head,head,0,7);ctx.fill();
  ctx.fillStyle='#2B3A42';ctx.beginPath();ctx.arc(x,fy-leg-body-head-head*.2,head,Math.PI,0);ctx.fill();
  if(o.dir){ctx.fillStyle='#2B3A42';ctx.beginPath();ctx.arc(x+o.dir*head*.45,fy-leg-body-head,1.8,0,7);ctx.fill()}
}
function drawBin(G,sc,L){
  const segs=binSegs(G);
  const body={office:'#8A99A3',cafe:'#3A3F45',school:'#4BA3C3',park:'#1F7A4D',subway:'#5E707A',city:'#5E707A'}[sc];
  const wob=binWob>0?Math.sin(binWob*40)*binWob*.12:0;
  shadow(G.bx,G.floorY,G.bw*.6,.2);
  ctx.save();ctx.translate(G.bx,G.floorY);ctx.rotate(wob);ctx.translate(-G.bx,-G.floorY);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(G.bx,G.topY,G.bw/2,G.r*.55,0,0,7);ctx.fill();
  for(let i=0;i<goals-(state==='in'?1:0);i++){ctx.fillStyle='#FBFBF8';ctx.beginPath();ctx.arc(G.bx+((i*37)%5-2)*G.r*.45,G.topY+G.r*.1,G.r*.75,Math.PI,0);ctx.fill()}
  ctx.restore();
  return ()=>{
    ctx.save();ctx.translate(G.bx,G.floorY);ctx.rotate(wob);ctx.translate(-G.bx,-G.floorY);
    if(L.move){ctx.fillStyle='#E0A800';rr(G.bx-G.bw*.62,G.floorY-G.r*.95,G.bw*1.24,G.r*.65,3);ctx.fill();ctx.fillStyle='#2B3A42';for(const d of[-.45,.45]){ctx.beginPath();ctx.arc(G.bx+d*G.bw,G.floorY-G.r*.3,G.r*.32,0,7);ctx.fill()}}
    const gr=ctx.createLinearGradient(G.bx-G.bw/2,0,G.bx+G.bw/2,0);gr.addColorStop(0,body);gr.addColorStop(.35,'rgba(255,255,255,.0)');gr.addColorStop(1,'rgba(0,0,0,.0)');
    ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(segs[0][0],segs[0][1]);ctx.lineTo(segs[0][2],segs[0][3]);ctx.lineTo(segs[1][2],segs[1][3]);ctx.lineTo(segs[1][0],segs[1][1]);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(segs[0][0]+G.bw*.12,segs[0][1]);ctx.lineTo(segs[0][2]+G.bw*.1,segs[0][3]);ctx.lineTo(segs[0][2]+G.bw*.2,segs[0][3]);ctx.lineTo(segs[0][0]+G.bw*.24,segs[0][1]);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=1.5;
    for(let i=1;i<6;i++){const t=i/6;ctx.beginPath();ctx.moveTo(segs[0][0]+(segs[1][0]-segs[0][0])*t,G.topY+3);ctx.lineTo(segs[0][2]+(segs[1][2]-segs[0][2])*t,G.floorY-3);ctx.stroke()}
    ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(G.bx,G.topY,G.bw/2,G.r*.55,0,0,Math.PI);ctx.stroke();
    ctx.restore();
  };
}
function drawBall(b){
  const sq=b.sq>0?b.sq*2:0;
  ctx.save();ctx.translate(b.x,b.y);ctx.scale(1+sq,1-sq);ctx.rotate(b.rot);
  ctx.fillStyle='#FBFBF8';ctx.beginPath();
  for(let i=0;i<11;i++){const a=i/11*Math.PI*2,q=b.r*(.86+((i*7)%3)*.08);ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q)}ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.08)';ctx.beginPath();ctx.arc(b.r*.2,b.r*.25,b.r*.6,0,7);ctx.fill();
  ctx.strokeStyle='#9AA8AF';ctx.lineWidth=1.3;ctx.beginPath();for(let i=0;i<11;i++){const a=i/11*Math.PI*2,q=b.r*(.86+((i*7)%3)*.08);ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q)}ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-b.r*.5,-b.r*.2);ctx.lineTo(0,b.r*.1);ctx.lineTo(b.r*.4,-b.r*.4);ctx.moveTo(-b.r*.2,b.r*.5);ctx.lineTo(b.r*.3,b.r*.25);ctx.moveTo(-b.r*.6,b.r*.3);ctx.lineTo(-b.r*.3,b.r*.6);ctx.stroke();
  ctx.strokeStyle='rgba(45,108,223,.35)';ctx.beginPath();ctx.moveTo(-b.r*.7,-b.r*.5);ctx.lineTo(b.r*.1,-b.r*.65);ctx.stroke();
  ctx.restore();
}
function drawBird(b,r){
  ctx.save();ctx.translate(b.x,b.y);ctx.scale(b.vx<0?-1:1,1);
  ctx.fillStyle='#8A93A0';ctx.beginPath();ctx.ellipse(0,0,r*1.1,r*.7,0,0,7);ctx.fill();
  ctx.fillStyle='#5E6A78';ctx.beginPath();ctx.arc(r*.9,-r*.4,r*.45,0,7);ctx.fill();
  ctx.fillStyle='#4F9147';ctx.fillRect(r*.55,-r*.1,r*.4,r*.18);
  ctx.fillStyle='#E0A800';ctx.beginPath();ctx.moveTo(r*1.3,-r*.4);ctx.lineTo(r*1.7,-r*.3);ctx.lineTo(r*1.3,-r*.2);ctx.fill();
  const f=Math.sin(b.ph)*r*.9;ctx.fillStyle='#6F7885';ctx.beginPath();ctx.moveTo(-r*.3,0);ctx.lineTo(r*.3,0);ctx.lineTo(-r*.2,-f-r*.2);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawPlayer(G,sc){
  const h=(G.floorY-G.sy)+G.r*2.2,x=G.sx-G.r*2.2,fy=G.floorY;
  const shirt={office:'#2D6CDF',cafe:'#C8553D',school:'#1F2A30',park:'#E0A800',subway:'#7D5BA6',city:'#3A3F45'}[sc];
  drawPerson(x,fy,h,shirt,.5,{dir:1});
  ctx.strokeStyle='#F2C9A0';ctx.lineWidth=Math.max(4,h*.05);ctx.lineCap='round';
  const shY=fy-h*.42-h*.38;let hx=G.sx-G.r*.8,hy=G.sy+G.r*.4;
  if(drag&&state==='aim'){const d=aimVec();if(d){hx-=d.vx/G.vmax*G.r*1.2;hy-=d.vy/G.vmax*G.r*1.2}}
  ctx.beginPath();ctx.moveTo(x+h*.06,shY);ctx.lineTo(hx,hy);ctx.stroke();
}
function drawAim(G,L){
  const b=ball;
  if(lastAim&&!drag){const len=40+lastAim.p*70,ang=Math.atan2(lastAim.dy,lastAim.dx);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);ctx.setLineDash([5,6]);ctx.strokeStyle='rgba(31,42,48,.3)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.r+6,0);ctx.lineTo(b.r+6+len,0);ctx.stroke();ctx.restore();ctx.setLineDash([])}
  const av=aimVec();
  if(!av){if(lv===0&&thrown===0&&!drag){
    const t=(time%1.6)/1.6,hx=b.x+G.r*2+t*G.r*6,hy=b.y+G.r*3-t*G.r*5;ctx.globalAlpha=1-t;ctx.fillStyle='#1F2A30';ctx.beginPath();ctx.arc(hx,hy,G.r*.7,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.font=`${Math.round(clamp(S*.042,15,22))}px Jua, sans-serif`;ctx.textAlign='left';const msg='↗ 던질 방향으로 쓱 밀었다 떼기';const tx=Math.max(8,Math.min(b.x+G.r*2,W-ctx.measureText(msg).width-10)),ty=b.y-G.r*4;ctx.lineWidth=5;ctx.strokeStyle='#FBFBF8';ctx.strokeText(msg,tx,ty);ctx.fillStyle='#1F2A30';ctx.fillText(msg,tx,ty)}
    return}
  if(L.guide){let x=b.x,y=b.y,vx=av.vx,vy=av.vy;ctx.fillStyle='rgba(31,42,48,.45)';
    for(let i=1;i<=10;i++){for(let k=0;k<4;k++){const h=.012;vy+=G.g*h;x+=vx*h;y+=vy*h}ctx.beginPath();ctx.arc(x,y,Math.max(2,4-i*.2),0,7);ctx.fill()}}
  const len=40+av.p*70,ang=Math.atan2(av.vy,av.vx),col=av.p>=1?'#D9480F':'#1F2A30';
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(b.r+6,0);ctx.lineTo(b.r+6+len,0);ctx.moveTo(b.r+len-5,-9);ctx.lineTo(b.r+6+len,0);ctx.lineTo(b.r+len-5,9);ctx.stroke();ctx.restore();
  const deg=Math.round(-ang*180/Math.PI),pw=Math.round(av.p*100);
  const mx=b.x-30,my=b.y+b.r+14;ctx.fillStyle='rgba(251,251,248,.9)';rr(mx-6,my-4,72,30,6);ctx.fill();
  ctx.fillStyle='#E3E8E6';rr(mx,my,60,7,4);ctx.fill();ctx.fillStyle=col;rr(mx,my,Math.max(7,60*av.p),7,4);ctx.fill();
  ctx.font='12px Jua, sans-serif';ctx.textAlign='left';ctx.fillStyle='#1F2A30';ctx.fillText(`힘 ${pw} · ${deg}°`,mx,my+21);
}
function draw(){
  const G=geo(),L=STAGES[lv];
  ctx.save();ctx.lineJoin='round';
  if(shake>0){ctx.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24)}
  drawScene(G,L.sc);
  drawObstacles(G);
  const binFront=drawBin(G,L.sc,L);
  if(ball&&state!=='menu'){
    if(state==='fly'||state==='aim'){const hgt=clamp((G.floorY-ball.y)/(H*.6),0,1);ctx.fillStyle=`rgba(20,28,32,${.18*(1-hgt*.7)})`;ctx.beginPath();ctx.ellipse(ball.x,G.floorY+2,ball.r*(1.1-hgt*.5),ball.r*.25,0,0,7);ctx.fill()}
    ball.trail.forEach((p,i)=>{ctx.fillStyle=`rgba(255,255,255,${.5*i/ball.trail.length})`;ctx.beginPath();ctx.arc(p.x,p.y,ball.r*(i/ball.trail.length)*.7,0,7);ctx.fill()});
    if(state!=='in'||ball.y<G.topY+ball.r)drawBall(ball);
    else{ctx.save();ctx.beginPath();ctx.rect(0,0,W,G.topY+ball.r*.2);ctx.clip();drawBall(ball);ctx.restore()}
  }
  binFront();
  for(const w of walkers){const dir=Math.sign(w.vx);ctx.save();if(w.hit>0){ctx.translate(w.x,G.floorY);ctx.rotate(Math.sin(w.hit*20)*.06);ctx.translate(-w.x,-G.floorY)}drawPerson(w.x,G.floorY,w.h,w.c,w.ph,{sc:w.sc,bag:w.bag,kid:w.kid,dir,walk:1});ctx.restore()}
  if(state!=='menu')drawPlayer(G,L.sc);
  for(const b of birds)drawBird(b,G.r*1.1);
  if(ball&&state==='aim'&&!paused)drawAim(G,L);
  for(const p of parts){ctx.save();ctx.globalAlpha=Math.min(1,p.life*1.5);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore()}
  ctx.textAlign='center';
  for(const t of texts){const k=t.max-t.life<.15?(t.max-t.life)/.15:1;ctx.font=`${Math.round(clamp(S*.06,20,34)*t.scale*(.6+.4*k))}px Jua, "Gowun Dodum", sans-serif`;ctx.globalAlpha=Math.min(1,t.life*2);ctx.lineWidth=5;ctx.strokeStyle='#FBFBF8';ctx.strokeText(t.t,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.t,t.x,t.y);ctx.globalAlpha=1}
  if(banner&&state!=='menu'){const a=Math.min(1,banner.life*2,(2.2-banner.life)*4);ctx.globalAlpha=a;const fs=Math.round(clamp(S*.065,22,38));ctx.font=`${fs}px Jua, sans-serif`;const tw=Math.max(ctx.measureText(banner.t).width,120);
    ctx.save();ctx.translate(W/2,H*.3);ctx.rotate(-.02);ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(-tw/2-16,-fs+4,tw+36,fs*1.9);ctx.fillStyle='#FFD84D';ctx.fillRect(-tw/2-18,-fs,tw+36,fs*1.9);
    ctx.fillStyle='#1F2A30';ctx.font=`${Math.round(fs*.45)}px Jua, sans-serif`;ctx.fillText(banner.sub,0,-fs*.3);ctx.font=`${fs}px Jua, sans-serif`;ctx.fillText(banner.t,0,fs*.6);ctx.restore();ctx.globalAlpha=1}
  if(state==='menu'){ctx.fillStyle='rgba(0,0,0,0)';}
  ctx.restore();
}

let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(Math.abs(W-cv.getBoundingClientRect().width)>.5||Math.abs(H-cv.getBoundingClientRect().height)>.5)resize();update(dt);draw();requestAnimationFrame(loop)}
(function boot(){const G=geo();ball={x:G.sx,y:G.sy,vx:0,vy:0,r:G.r,rot:0,trail:[],sq:0};titleScreen();requestAnimationFrame(loop);initNet()})();
</script>
